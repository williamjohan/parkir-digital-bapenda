name: parkir_digital_bapenda
description: "Untuk Melakukan Pembayaran Parkir Secara Digital Di Kota Surabaya"
publish_to: "none"

# versionName: 1.0.0 (Yang dilihat User)
# buildNumber: 1     (Yang dibaca sistem OTA)
version: 1.0.1+4

environment:
  sdk: ^3.9.2 # Pastikan versi SDK ini sesuai dengan instalasi lokalmu

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management & Clean Architecture Core ---
  flutter_bloc: ^9.1.1
  get_it: ^7.7.0
  injectable: ^2.4.1
  dartz: ^0.10.1
  equatable: ^2.0.8
  go_router: ^13.2.0
  freezed_annotation: ^2.4.1

  # --- Networking & API ---
  dio: ^5.9.2
  dio_smart_retry: ^6.0.0
  chucker_flutter: ^1.9.1
  signalr_netcore: ^1.3.7

  # --- Local Storage & Database ---
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.2

  # --- Hardware, Permissions & System ---
  camera: 0.10.5+9
  geolocator: ^13.0.1
  permission_handler: ^12.0.1
  app_settings: ^5.1.1
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.3
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  # flutter_bluetooth_serial: ^0.4.0 # (Legacy/Unused)

  # --- OTA Update System ---
  ota_update: ^7.1.0
  package_info_plus: ^9.0.1

  # --- Machine Learning (OCR) ---
  google_mlkit_text_recognition: ^0.14.0

  # --- UI, Animations & Images ---
  lottie: ^3.1.0
  shimmer_animation: ^2.2.2+1
  fl_chart: ^1.2.0
  pretty_qr_code: ^3.6.0
  flutter_image_compress: ^2.4.0
  saver_gallery: ^4.1.1

  # --- Utilities & Helpers ---
  flutter_dotenv: ^6.0.0
  logger: ^2.4.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.3
  jwt_decoder: ^2.0.1
  crypto: ^3.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- Code Generators ---
  build_runner: ^2.4.9
  injectable_generator: ^2.6.1
  json_serializable: ^6.8.0
  freezed: ^2.5.2

  # --- App Icons & Naming ---
  flutter_launcher_icons: ^0.13.1

# --- CONFIGURATION ---
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/iconlogo/LOGO-TS-PARKIR-REV.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/iconlogo/ScreensaverTS_Park.png

  android_12:
    image: assets/iconlogo/ScreensaverTS_Park.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

  assets:
    - .env
    - assets/images/
    - assets/lottie/
    - assets/iconlogo/
